<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-container">

    <div class="chat-header">
      <div class="avatar">✦</div>
      <div class="header-info">
        <h1>AI Assistant</h1>
        <div class="status">
          <span class="status-dot"></span>
          <span>online · llama3-8b</span>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">◈</div>
        <h2>Start a conversation</h2>
        <p>Type a message below to begin.</p>
      </div>
    </div>

    <div class="input-area">
      <div id="error-container"></div>

      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="Type a message..."></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

      <div class="hint">Press Enter to send · Shift+Enter for new line</div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
